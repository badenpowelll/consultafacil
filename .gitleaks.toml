title = "Consulta Fácil"

[extend]
useDefault = true

[[rules]]
id = "chave-dados-consulta-facil"
description = "Chave de dados ou de índice do Consulta Fácil"
regex = '''CF_(CHAVES_DADOS|CHAVE_INDICE)\s*[=:]\s*["']?[0-9]:?[A-Za-z0-9+/]{40,}={0,2}'''

[[rules]]
id = "url-banco-com-senha"
description = "Cadeia de conexão de banco com senha (Railway, Postgres)"
regex = '''postgres(?:ql)?://[^\s:/@'"]+:([^\s@'"]{6,})@[^\s'"]+'''
secretGroup = 1
[rules.allowlist]
regexTarget = "match"
regexes = ['''://[^:]+:(TROQUE|postgres|senha-de-ci-apenas-para-testes-0001|senha-local-de-teste-1234567890)@''']

[[rules]]
id = "senha-cf-app"
description = "Senha do papel cf_app ou do seed definida em arquivo"
regex = '''(CF_APP_DB_PASSWORD|CF_SEED_SENHA)\s*[=:]\s*["']?([^\s"'#]{8,})'''
secretGroup = 2
[rules.allowlist]
regexTarget = "match"
regexes = ['''senha-de-ci-apenas-para-testes-0001''']

[allowlist]
description = "Valores fictícios de CI e testes"
paths = ['''^\.github/workflows/ci\.yml$''', '''^tests/''']
